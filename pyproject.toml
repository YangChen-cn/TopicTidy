[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "downloads-organizer"
version = "0.7.0"
description = "A local, explainable macOS Downloads organizer"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "platformdirs==4.4.0",
  "pypdf==6.0.0",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
  "rich==14.1.0",
  "typer==0.17.4",
  "watchdog==6.0.0",
]

[project.urls]
Homepage = "https://github.com/YangChen-cn/TopicTidy"
Repository = "https://github.com/YangChen-cn/TopicTidy"
Issues = "https://github.com/YangChen-cn/TopicTidy/issues"

[project.optional-dependencies]
dev = ["hatchling==1.27.0", "pytest==8.4.2"]

[project.scripts]
downloads-organizer = "downloads_organizer.cli:app"
tt = "downloads_organizer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/downloads_organizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
