name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test
      - name: Benchmark gates
        run: |
          swift build -c release
          .build/release/tt benchmark --json --min-f1 1.0
          .build/release/tt benchmark Resources/fixtures/holdout_unseen.json --json --min-f1 0.94
