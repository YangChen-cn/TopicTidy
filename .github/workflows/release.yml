name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Release notes diff against the previous tag, so the checkout needs
          # the full history and every tag.
          fetch-depth: 0
          fetch-tags: true

      - name: Toolchain
        run: |
          swift --version
          version=$(swift -version 2>&1 | sed -n 's/.*Swift version \([0-9]*\.[0-9]*\).*/\1/p' | head -1)
          awk -v v="$version" 'BEGIN { split(v, p, "."); if (p[1] < 6 || (p[1] == 6 && p[2] < 2)) exit 1 }' \
            || { echo "::error::TopicTidyCore needs Swift 6.2 or newer (use a macOS 26 runner image)"; exit 1; }

      - name: Check tag against source version
        run: |
          version=$(sed -n 's/.*static let version = "\(.*\)".*/\1/p' Sources/TopicTidyCore/Config/AppInfo.swift | head -1)
          echo "source version: $version, tag: $GITHUB_REF_NAME"
          [ "v$version" = "$GITHUB_REF_NAME" ] \
            || { echo "::error::tag $GITHUB_REF_NAME does not match AppInfo.version $version"; exit 1; }

      # The self-signed TopicTidy certificate lives in repository secrets; the
      # packaging scripts pick it up automatically and fall back to ad-hoc
      # signing when it is absent (forks, local runs).
      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          # A published release must always carry the same signature. Without
          # the certificate the packaging scripts would silently fall back to
          # ad-hoc, so stop here instead.
          if [ -z "$CERTIFICATE_P12" ]; then
            echo "::error::CERTIFICATE_P12 is not configured; refusing to publish an ad-hoc signed release."
            echo "Export the TopicTidy identity as .p12, base64 it, and store it with CERTIFICATE_PASSWORD."
            exit 1
          fi
          keychain="$RUNNER_TEMP/topictidy.keychain-db"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p actions "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p actions "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          # `find-identity -v` hides self-signed certificates, so prove the
          # identity works by actually signing something.
          cp /bin/echo "$RUNNER_TEMP/signing-check"
          codesign --force --sign TopicTidy --timestamp=none "$RUNNER_TEMP/signing-check" \
            || { echo "::error::cannot sign with the TopicTidy identity"; exit 1; }
          codesign -dv --verbose=2 "$RUNNER_TEMP/signing-check" 2>&1 | grep -q "Authority=TopicTidy" \
            || { echo "::error::signing check did not produce a TopicTidy signature"; exit 1; }
          echo "signing identity ready: TopicTidy"

      - name: Test
        run: swift test

      # The only release build. Everything after this reuses these binaries.
      - name: Build release binaries
        run: swift build -c release -Xswiftc -debug-prefix-map -Xswiftc "$PWD=."

      - name: Benchmark gates
        run: |
          .build/release/tt benchmark --json --min-f1 1.0
          .build/release/tt benchmark Resources/fixtures/holdout_unseen.json --json --min-f1 0.94
          .build/release/tt benchmark Resources/fixtures/upgrade_development.json --json --min-f1 1.0
          .build/release/tt benchmark Resources/fixtures/upgrade_holdout.json --json --min-f1 1.0

      - name: Build app and DMG
        run: scripts/build_app.sh --skip-build

      - name: Build CLI archive
        run: scripts/package_cli.sh --skip-build

      - name: Release notes
        run: |
          mkdir -p dist
          scripts/generate_release_notes.sh "$GITHUB_REF_NAME" > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 TopicTidy-*-arm64.dmg topictidy-cli-*-arm64.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Verify release assets
        run: |
          cd dist
          codesign -dv --verbose=2 TopicTidy.app 2>&1 | grep -E "Authority|Signature=" || true
          codesign -dv --verbose=2 TopicTidy.app 2>&1 | grep -q "Authority=TopicTidy" \
            || { echo "::error::release app is not signed with TopicTidy"; exit 1; }
          [ ! -e python ] || { echo "::error::a Python runtime leaked into the build"; exit 1; }
          tar -tzf topictidy-cli-*-arm64.tar.gz
          dmg=$(ls TopicTidy-*-arm64.dmg)
          hdiutil attach "$dmg" -nobrowse -mountpoint /tmp/topictidy-dmg > /dev/null
          test -x "/tmp/topictidy-dmg/TopicTidy.app/Contents/MacOS/TopicTidy"
          test -x "/tmp/topictidy-dmg/TopicTidy.app/Contents/Resources/tt"
          if find /tmp/topictidy-dmg/TopicTidy.app -name 'python*' | grep -q .; then
            echo "::error::bundle contains Python"; exit 1
          fi
          hdiutil detach /tmp/topictidy-dmg > /dev/null

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "TopicTidy $GITHUB_REF_NAME" \
            --notes-file dist/RELEASE_NOTES.md \
            dist/TopicTidy-*-arm64.dmg \
            dist/topictidy-cli-*-arm64.tar.gz \
            dist/SHA256SUMS.txt

  # Keeps the tap pinned to the artefacts GitHub actually published; it needs a
  # token that can write to YangChen-cn/homebrew-tap.
  tap:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tap token
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_GITHUB_TOKEN" ]; then
            echo "::error::TAP_GITHUB_TOKEN is not configured; cannot update the Homebrew tap."
            echo "Add a PAT with write access to YangChen-cn/homebrew-tap as TAP_GITHUB_TOKEN."
            exit 1
          fi

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: scripts/publish_tap.sh --version "${GITHUB_REF_NAME#v}"
